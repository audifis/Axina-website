<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<meta name="theme-color" content="#060d1a">
<link rel="canonical" href="https://axina.pro/{{canonical}}">
<link rel="alternate" hreflang="fr" href="https://axina.pro/{{canonical}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AXINA">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="{{ogtitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="https://axina.pro/{{canonical}}">
<meta property="og:image" content="https://axina.pro/assets/img/{{ogimage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ogalt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ogtitle}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="https://axina.pro/assets/img/{{ogimage}}">
<meta name="twitter:image:alt" content="{{ogalt}}">
<link rel="icon" href="/favicon.ico?v=3" sizes="48x48">
<link rel="icon" href="/assets/img/axina-icon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png?v=3">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/assets/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/axina.css?v={{v}}">
<script defer src="/assets/axina.js?v={{v}}"></script>
{{jsonld}}
</head>
